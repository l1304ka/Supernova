{% extends "base.html" %}
{% block title %}Создать урок{% endblock %}

{% block content %}
<div class="container mt-4 pb-5" style="max-width:640px;">

  <!-- Шапка -->
  <div class="mb-4">
    <a href="{% url 'index' %}" class="back-link">← Назад</a>
    <div class="eyebrow mt-3">Панель учителя</div>
    <h2 class="page-heading">Создать урок</h2>
  </div>

  <form method="post" id="lesson-form">
    {% csrf_token %}

    <!-- Предмет -->
    <div class="fcard mb-3">
      <div class="fcard-label">Предмет</div>
      <select name="subject" id="subject-select" class="finput" required>
        <option value="">Выберите предмет</option>
        {% for s in subjects %}
        <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Название -->
    <div class="fcard mb-3">
      <div class="fcard-label">Название урока</div>
      <input type="text" name="title" class="finput" placeholder="Например: Оптика. Лучи света" required>
    </div>

    <!-- Дата -->
    <div class="fcard mb-3">
      <div class="fcard-label">Дата проведения</div>
      <input type="date" name="date" id="date-input" class="finput" required>
    </div>

    <!-- Темы -->
    <div class="fcard mb-4">
      <div class="fcard-label">Темы урока</div>
      <div id="topics-area">
        <div class="topics-empty" id="topics-placeholder">Сначала выберите предмет</div>
        <div id="topics-list" class="topics-list"></div>
      </div>
    </div>

    <!-- Кнопки -->
    <div class="d-flex gap-3 align-items-center">
      <button type="submit" class="abtn abtn-primary abtn-lg">Создать урок</button>
      <a href="{% url 'index' %}" class="abtn">Отмена</a>
    </div>
  </form>

</div>

<style>
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.35}
.page-heading{font-size:1.8rem;font-weight:800;margin-bottom:0}
.back-link{font-size:.85rem;opacity:.4;text-decoration:none;color:inherit;transition:opacity .15s}
.back-link:hover{opacity:.8;color:inherit}

/* Form card */
.fcard{border-radius:12px;border:1px solid rgba(255,255,255,.08);padding:16px 18px}
[data-bs-theme="light"] .fcard{border-color:rgba(0,0,0,.09);background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.fcard-label{font-size:.78rem;font-weight:700;opacity:.45;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}

/* Inputs */
.finput{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:9px;padding:10px 14px;font-size:.95rem;color:inherit;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
[data-bs-theme="light"] .finput{background:#f8f9fa;border-color:rgba(0,0,0,.12);color:#212529}
.finput:focus{border-color:#4a8df0}
.finput option{background:#1e2130;color:#fff}
[data-bs-theme="light"] .finput option{background:#fff;color:#212529}

/* Topics */
.topics-empty{font-size:.88rem;opacity:.35;padding:6px 0}
.topics-list{display:flex;flex-direction:column;gap:4px}
.topic-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;transition:background .12s;user-select:none}
.topic-item:hover{background:rgba(255,255,255,.05)}
[data-bs-theme="light"] .topic-item:hover{background:#f0f2f5}
.topic-item input[type=checkbox]{display:none}
.topic-cb{width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s}
[data-bs-theme="light"] .topic-cb{border-color:rgba(0,0,0,.2)}
.topic-item.checked .topic-cb{background:#4a8df0;border-color:#4a8df0}
.topic-item.checked .topic-cb::after{content:"✓";font-size:.72rem;color:#fff;font-weight:900;line-height:1}
.topic-name{font-size:.9rem;font-weight:600}

/* Buttons */
.abtn{flex-shrink:0;border-radius:9px;padding:8px 18px;font-size:.88rem;font-weight:700;text-decoration:none;transition:.12s;white-space:nowrap;cursor:pointer;display:inline-block;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);color:inherit}
[data-bs-theme="light"] .abtn{background:#f0f0f0;border-color:rgba(0,0,0,.1);color:#333}
.abtn:hover{background:rgba(255,255,255,.13);color:inherit}
[data-bs-theme="light"] .abtn:hover{background:#e4e4e4;color:#333}
.abtn-primary{background:#4a8df0;border-color:#4a8df0;color:#fff}
.abtn-primary:hover{background:#3a7de0;border-color:#3a7de0;color:#fff}
.abtn-lg{padding:10px 28px;font-size:.95rem}
</style>

<script>
// Set today's date as default
document.addEventListener("DOMContentLoaded", function () {
  const d = new Date();
  const iso = d.toISOString().split("T")[0];
  document.getElementById("date-input").value = iso;
});

document.getElementById("subject-select").addEventListener("change", function () {
  const subjectId = this.value;
  const list = document.getElementById("topics-list");
  const placeholder = document.getElementById("topics-placeholder");
  list.innerHTML = "";

  if (!subjectId) {
    placeholder.style.display = "";
    return;
  }

  placeholder.style.display = "none";

  fetch(`/get_topics_by_subject/?subject_id=${subjectId}`)
    .then(r => r.json())
    .then(data => {
      if (!data.topics.length) {
        placeholder.textContent = "Нет тем для этого предмета";
        placeholder.style.display = "";
        return;
      }

      data.topics.forEach(t => {
        const item = document.createElement("label");
        item.className = "topic-item";
        item.innerHTML = `
          <input type="checkbox" name="topics" value="${t.id}">
          <div class="topic-cb"></div>
          <span class="topic-name">${t.name}</span>
        `;
        item.addEventListener("change", function () {
          this.classList.toggle("checked", this.querySelector("input").checked);
        });
        list.appendChild(item);
      });
    });
});
</script>
{% endblock %}
