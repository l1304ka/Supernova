{% extends "base.html" %}
{% block title %}404 — Страница не найдена{% endblock %}
{% block content %}
<div class="err-page">
  <div class="err-code">404</div>
  <div class="err-title">Страница не найдена</div>
  <div class="err-sub">Возможно, ссылка устарела или вы опечатались в адресе.</div>
  <a href="/" class="err-btn">← На главную</a>
</div>
<style>
.err-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;text-align:center;padding:40px 20px}
.err-code{font-size:8rem;font-weight:900;line-height:1;letter-spacing:-.04em;opacity:.08;margin-bottom:8px;user-select:none}
.err-title{font-size:1.75rem;font-weight:800;margin-bottom:10px}
.err-sub{font-size:.95rem;opacity:.45;max-width:380px;line-height:1.5;margin-bottom:28px}
.err-btn{display:inline-block;background:#4a8df0;color:#fff;border:none;border-radius:10px;padding:10px 26px;font-size:.92rem;font-weight:700;text-decoration:none;transition:background .15s}
.err-btn:hover{background:#3a7de0;color:#fff}
</style>
{% endblock %}
