{% extends "adminpanel/base_admin.html" %}
{% block admin_content %}
  <h2>Ученики класса {{ school_class.name }}</h2>

  <form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}

    <label class="form-label">Ученики</label>
    <select name="students" class="form-select" multiple size="10">
      {% for s in all_students %}
        <option value="{{ s.id }}" {% if s in school_class.students.all %}selected{% endif %}>
          {{ s.surname }} {{ s.name }} ({{ s.user.username }})
        </option>
      {% endfor %}
    </select>
    <small class="text-muted">Удерживай Ctrl / Cmd, чтобы выбрать несколько.</small>
    <button class="btn btn-primary mt-3">Сохранить</button>
  </form>

{% endblock %}
