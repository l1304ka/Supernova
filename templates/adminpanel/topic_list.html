{% extends "adminpanel/base_admin.html" %}
{% block admin_content %}
<h2>Темы</h2>

<a href="{% url 'admin_add_topic' %}" class="btn btn-success mb-3">Добавить тему</a>

<table class="table table-striped shadow-sm">
    <thead>
        <tr><th>ID</th><th>Название</th><th>Подтемы</th><th></th></tr>
    </thead>
    <tbody>
        {% for t in topics %}
        <tr>
            <td>{{ t.id }}</td>
            <td>{{ t.name }}</td>
            <td>{{ t.subtopics.count }}</td>
            <td>
                <a class="btn btn-sm btn-primary"
                   href="{% url 'admin_edit_topic' t.id %}">Изменить</a>
                <a class="btn btn-sm btn-danger"
                   href="{% url 'admin_delete_topic' t.id %}">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
