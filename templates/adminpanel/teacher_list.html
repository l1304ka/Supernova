{% extends "adminpanel/base_admin.html" %}
{% block admin_content %}
<h2>Учителя</h2>

<a href="{% url 'admin_add_teacher' %}" class="btn btn-success mb-3">Добавить учителя</a>

<table class="table table-striped table-bordered shadow-sm">
    <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Логин</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Отчество</th>
        </tr>
    </thead>
    <tbody>
        {% for t in teachers %}
        <tr>
            <td>{{ t.id }}</td>
            <td>{{ t.user.username }}</td>
            <td>{{ t.name }}</td>
            <td>{{ t.surname }}</td>
            <td>{{ t.patronymic }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
