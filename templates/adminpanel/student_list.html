{% extends "adminpanel/base_admin.html" %}
{% block admin_content %}
  <h2>Ученики</h2>

  <a href="{% url 'admin_add_student' %}" class="btn btn-success mb-3">Добавить ученика</a>

  <table class="table table-striped table-bordered shadow-sm">
    <thead class="table-light">
    <tr>
      <th>ID</th>
      <th>Логин</th>
      <th>Имя</th>
      <th>Фамилия</th>
      <th>Отчество</th>
    </tr>
    </thead>
    <tbody>
    {% for s in students %}
      <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.user.username }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.surname }}</td>
        <td>{{ s.patronymic }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
