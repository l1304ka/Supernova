{% extends "adminpanel/base_admin.html" %}
{% block admin_content %}
  <h2>Учителя класса {{ school_class.name }}</h2>

  <form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}

    <label class="form-label">Учителя</label>
    <select name="teachers" class="form-select" multiple size="10">
      {% for t in all_teachers %}
        <option value="{{ t.id }}" {% if t in school_class.teachers.all %}selected{% endif %}>
          {{ t.surname }} {{ t.name }} ({{ t.user.username }})
        </option>
      {% endfor %}
    </select>
    <small class="text-muted">Удерживай Ctrl / Cmd, чтобы выбрать несколько.</small>
    <button class="btn btn-primary mt-3">Сохранить</button>
  </form>

{% endblock %}
