<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ошибка{% endblock %} — Adaptive School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      color: #e8eaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
    }
    .err-wrap {
      text-align: center;
      padding: 40px 24px;
      max-width: 480px;
    }
    .err-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -.04em;
      color: rgba(255,255,255,.07);
      margin-bottom: 8px;
      user-select: none;
    }
    .err-title {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .err-sub {
      font-size: .95rem;
      color: rgba(255,255,255,.4);
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .err-btn {
      display: inline-block;
      background: #4a8df0;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 26px;
      font-size: .92rem;
      font-weight: 700;
      text-decoration: none;
      transition: background .15s;
    }
    .err-btn:hover { background: #3a7de0; color: #fff; }
    .err-back {
      display: block;
      margin-top: 14px;
      font-size: .82rem;
      color: rgba(255,255,255,.3);
      text-decoration: none;
      transition: color .15s;
    }
    .err-back:hover { color: rgba(255,255,255,.65); }
  </style>
</head>
<body>
  <div class="err-wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
