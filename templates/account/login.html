{% extends "base.html" %}
{% block title %}Вход — Adaptive School{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <span class="auth-logo-icon">🎓</span>
      <span class="auth-logo-text">Adaptive School</span>
    </div>

    <h1 class="auth-title">Добро пожаловать</h1>
    <p class="auth-sub">Войдите в свой аккаунт</p>

    {% for m in messages %}
      <div class="auth-error">{{ m }}</div>
    {% endfor %}

    <form method="post" class="auth-form">
      {% csrf_token %}

      <div class="auth-field">
        <label class="auth-label">Логин</label>
        <input type="text" name="username" class="auth-input" placeholder="Введите логин" required autofocus>
      </div>

      <div class="auth-field">
        <label class="auth-label">Пароль</label>
        <div class="auth-input-wrap">
          <input type="password" name="password" id="passwordInput" class="auth-input" placeholder="Введите пароль" required>
          <button type="button" class="auth-eye" onclick="togglePassword()" title="Показать пароль">
            <svg id="eyeIcon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn">Войти</button>
    </form>

    <div class="auth-footer-links">
      <a href="{% url 'page_about' %}" class="auth-link">О платформе</a>
      <span class="auth-link-sep">·</span>
      <a href="{% url 'page_faq' %}" class="auth-link">FAQ</a>
    </div>

  </div>
</div>

<script>
function togglePassword() {
  const input = document.getElementById('passwordInput');
  const icon = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
</script>

<style>
.auth-wrap {
  min-height: calc(100vh - 140px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}
.auth-card {
  width: 100%;
  max-width: 420px;
  background: var(--bs-body-bg);
  border: 1px solid var(--bs-border-color);
  border-radius: 18px;
  padding: 40px 36px 32px;
  box-shadow: 0 4px 32px rgba(0,0,0,.08);
}
.auth-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin-bottom: 28px;
}
.auth-logo-icon { font-size: 1.8rem; }
.auth-logo-text { font-size: 1.15rem; font-weight: 800; }
.auth-title {
  font-size: 1.6rem;
  font-weight: 900;
  text-align: center;
  margin: 0 0 6px;
}
.auth-sub {
  text-align: center;
  font-size: .92rem;
  opacity: .5;
  margin: 0 0 28px;
}
.auth-error {
  background: rgba(231,76,60,.12);
  border: 1px solid rgba(231,76,60,.3);
  color: #e74c3c;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: .9rem;
  margin-bottom: 16px;
}
.auth-form { display: flex; flex-direction: column; gap: 18px; }
.auth-field { display: flex; flex-direction: column; gap: 6px; }
.auth-label { font-size: .88rem; font-weight: 700; opacity: .7; }
.auth-input-wrap { position: relative; }
.auth-input {
  width: 100%;
  background: var(--bs-tertiary-bg);
  border: 1.5px solid var(--bs-border-color);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: .97rem;
  color: var(--bs-body-color);
  transition: border-color .15s, box-shadow .15s;
  outline: none;
  box-sizing: border-box;
}
.auth-input:focus {
  border-color: #4a8df0;
  box-shadow: 0 0 0 3px rgba(74,141,240,.15);
}
.auth-input-wrap .auth-input { padding-right: 42px; }
.auth-eye {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  opacity: .4;
  color: var(--bs-body-color);
  padding: 0;
  line-height: 1;
  transition: opacity .15s;
}
.auth-eye:hover { opacity: .8; }
.auth-btn {
  width: 100%;
  background: #4a8df0;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: background .15s, transform .1s;
}
.auth-btn:hover { background: #3a7de0; }
.auth-btn:active { transform: scale(.98); }
.auth-footer-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
}
.auth-link { font-size: .85rem; opacity: .45; text-decoration: none; color: inherit; transition: opacity .15s; }
.auth-link:hover { opacity: .9; }
.auth-link-sep { opacity: .25; font-size: .85rem; }
</style>
{% endblock %}
