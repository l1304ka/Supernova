{% extends "base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
<h2>{{ test.lesson.subject.name }} — {{ test.title }}</h2>

<form method="post">
  {% csrf_token %}
  {% for q in questions %}
    <div style="margin-bottom: 20px;">
      <p><b>{{ forloop.counter }}.</b> {{ q.text }}</p>

      {% if q.is_open %}
        <input type="text" name="q{{ q.id }}" required>
      {% else %}
        <div>
          <label><input type="radio" name="q{{ q.id }}" value="1" required> 1</label>
          <label><input type="radio" name="q{{ q.id }}" value="2"> 2</label>
          <label><input type="radio" name="q{{ q.id }}" value="3"> 3</label>
          <label><input type="radio" name="q{{ q.id }}" value="4"> 4</label>
        </div>
      {% endif %}
    </div>
  {% endfor %}

  <button type="submit">Отправить</button>
</form>

{% endblock %}
