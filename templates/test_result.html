{% extends "base.html" %}

{% block title %}Результат теста{% endblock %}

{% block content %}
<div class="container mt-4">

  <div class="card shadow-sm p-4 mb-4">
    <h3 class="card-title mb-3">{{ result.test.title }}</h3>

    <p class="mb-1"><b>Балл:</b> {{ result.score }}%</p>
    <p class="mb-3">
      <b>Оценка:</b>
      <span class="badge
        {% if result.grade == 5 %}bg-success
        {% elif result.grade == 4 %}bg-primary
        {% elif result.grade == 3 %}bg-warning
        {% else %}bg-danger{% endif %}
      ">{{ result.grade }}</span>
    </p>

    <a href="{% url 'test_result_detail' result.id %}" class="btn btn-secondary">
      Посмотреть подробный разбор
    </a>
  </div>

  <a href="/" class="btn btn-outline-secondary">← На главную</a>

</div>
{% endblock %}
